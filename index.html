<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hi, I'm Aggie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cel-shaded landscape banner (sky, sun, drifting clouds, hills) holding the title,
   then two sticker-style tiles with ink outlines and hard offset shadows, each with its own small animated scene */
:root{
  --bg:#f3f8ee; --ink:#1a2b1f; --outline:#1a2b1f; --hard:#1a2b1f; --soft:#4d6355;
  --sky-top:#9fdcf5; --sky-bot:#e4f6fd; --cloud:#ffffff;
  --hill-far:#8fd18a; --hill-mid:#4fb35f; --hill-near:#2a8f4a;
  --forest:#25945a; --lake:#1591c4; --sunset:#ec7424; --sun:#ffc531; --sun-ray:#ffdf7a; --leaf:#b6e36b;
  --on-color:#ffffff; --badge:#ffffff;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1913; --ink:#eaf4ec; --outline:#06100a; --hard:#000000; --soft:#a8c0ae;
  --sky-top:#1b3550; --sky-bot:#2d5670; --cloud:#d9e6ee;
  --hill-far:#2f6b45; --hill-mid:#22573a; --hill-near:#17432b;
  --forest:#1f7f4c; --lake:#117aa6; --sunset:#c9601a; --sun:#ffd25a; --sun-ray:#e8c25a; --leaf:#8cc152;
  --badge:#f4f8f1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1913; --ink:#eaf4ec; --outline:#06100a; --hard:#000000; --soft:#a8c0ae;
  --sky-top:#1b3550; --sky-bot:#2d5670; --cloud:#d9e6ee;
  --hill-far:#2f6b45; --hill-mid:#22573a; --hill-near:#17432b;
  --forest:#1f7f4c; --lake:#117aa6; --sunset:#c9601a; --sun:#ffd25a; --sun-ray:#e8c25a; --leaf:#8cc152;
  --badge:#f4f8f1; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(color-mix(in srgb, var(--ink) 10%, transparent) 1.2px, transparent 1.4px);background-size:18px 18px}
.wrap{max-width:1100px;margin:0 auto;padding-block:40px 56px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}

/* ---------- banner ---------- */
.banner{position:relative;border:3px solid var(--outline);border-radius:18px;overflow:hidden;
  box-shadow:7px 7px 0 var(--hard);background:linear-gradient(var(--sky-top),var(--sky-bot) 70%)}
.banner{min-height:clamp(170px,26vw,260px)}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner-text{position:relative;padding:clamp(18px,4vw,36px) clamp(18px,4vw,40px) 110px;display:flex;flex-direction:column;gap:8px;max-width:72%}
.tag{align-self:flex-start;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--badge);color:#1a2b1f;border:2px solid var(--outline);border-radius:999px;padding:2px 12px}
h1{margin:0;font-family:var(--display);font-weight:900;letter-spacing:.02em;font-size:clamp(30px,6.4vw,58px);line-height:1.15;color:#1a2b1f;
  text-shadow:3px 3px 0 #ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#f4f8f1;text-shadow:3px 3px 0 #06100a}}
:root[data-theme="dark"] h1{color:#f4f8f1;text-shadow:3px 3px 0 #06100a}

.sun-rays{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}
.cloud{animation:drift linear infinite}
.cloud.c1{animation-duration:46s;animation-delay:-14s}
.cloud.c2{animation-duration:64s;animation-delay:-40s}
.cloud.c3{animation-duration:80s;animation-delay:-6s}
.bird{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.bird-path{animation:glide 22s linear infinite}
.leafy{transform-box:fill-box;transform-origin:bottom center;animation:sway 3.6s ease-in-out infinite alternate}
.leafy.l2{animation-delay:-1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1100px)}}
@keyframes flap{to{transform:scaleY(.55)}}
@keyframes glide{from{transform:translate(-120px,30px)}50%{transform:translate(480px,0)}to{transform:translate(1100px,20px)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

/* ---------- tiles ---------- */
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:300px;
  padding:24px 24px 22px;border:3px solid var(--outline);border-radius:18px;color:var(--on-color);text-decoration:none;overflow:hidden;
  box-shadow:7px 7px 0 var(--hard);transition:transform .16s ease, box-shadow .16s ease;
  animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
.tile.forest{background:var(--forest)}
.tile.lake{background:var(--lake);animation-delay:.08s}
.tile.sunset{background:var(--sunset);animation-delay:.16s}
.tile:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--hard)}
.tile:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--hard)}
.tile:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
@keyframes pop{from{transform:scale(.94) rotate(-1deg)}to{transform:none}}

.tile .scene{position:absolute;right:0;bottom:0;width:78%;height:66%;pointer-events:none}
.tile .top,.tile .bottom{position:relative;z-index:1}
.num{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:500;color:#1a2b1f;background:var(--badge);
  border:2px solid var(--outline);border-radius:8px;padding:0 8px;margin-bottom:12px}
.tile h2{margin:0;font-family:var(--display);font-weight:900;letter-spacing:.02em;font-size:clamp(24px,2.5vw,29px);line-height:1.3;
  text-shadow:2px 2px 0 rgba(0,0,0,.28)}
.bottom{display:flex;justify-content:flex-start}
.go{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
  background:var(--sun);color:#1a2b1f;border:3px solid var(--outline);font-size:20px;font-weight:900;
  box-shadow:3px 3px 0 var(--hard);transition:transform .2s ease}
.tile:hover .go{animation:hop .5s ease}
@keyframes hop{30%{transform:translate(4px,-6px) rotate(8deg)}60%{transform:translate(6px,0)}100%{transform:translate(4px,0)}}

/* tile 1：等高線描繪＋地圖標記彈跳 */
.contour path{stroke-dasharray:420;stroke-dashoffset:0;animation:draw 2.4s ease-out both}
.contour path:nth-child(2){animation-delay:.25s}
.contour path:nth-child(3){animation-delay:.5s}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
.pin{transform-box:fill-box;transform-origin:bottom center;animation:bounce 2.6s cubic-bezier(.3,1.5,.5,1) infinite}
.pin2{animation-delay:-1.3s}
@keyframes bounce{0%,55%,100%{transform:translateY(0)}20%{transform:translateY(-14px)}35%{transform:translateY(0) scaleY(.9)}}
.route{stroke-dasharray:6 7;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}

/* tile 2：水波流動＋閃光 */
.waves{animation:flow 6s linear infinite}
.waves.w2{animation-duration:9s;animation-direction:reverse}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-120px)}}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
.spark.s2{animation-delay:-.7s}.spark.s3{animation-delay:-1.4s}
@keyframes twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 3.2s ease-in-out infinite alternate}
.bar.b2{animation-delay:-1.1s}.bar.b3{animation-delay:-2s}
@keyframes grow{from{transform:scaleX(.55)}to{transform:scaleX(1)}}

/* tile 3：考卷打勾＋100 分印章＋星星 */
.tick{stroke-dasharray:40;animation:tick 3.6s ease-out infinite}
.tick.t2{animation-delay:.35s}.tick.t3{animation-delay:.7s}
@keyframes tick{0%{stroke-dashoffset:40}18%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp 3.6s cubic-bezier(.3,1.7,.5,1) infinite}
@keyframes stamp{0%,30%{transform:scale(1.6) rotate(-14deg);opacity:0}42%,88%{transform:scale(1) rotate(-14deg);opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:0}}
.star{transform-box:fill-box;transform-origin:center;animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-10px) rotate(8deg)}}

footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:2px dashed color-mix(in srgb, var(--ink) 25%, transparent);
  font-family:var(--mono);font-size:12px;color:var(--soft)}

@media (max-width:900px){
  .list{grid-template-columns:1fr}
  .tile{min-height:240px}
  .tile .scene{width:60%;height:100%}
  .banner-text{max-width:100%;padding-bottom:96px}
  .sun-wrap{transform:translate(880px,64px) scale(.75)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">


  <main class="list">
    <a class="tile forest" href="https://aggieyang1118.github.io/case-map/" target="_blank" rel="noopener">
      <svg class="scene" viewBox="0 0 240 250" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
        <g class="contour" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5">
          <path d="M150 40c50 0 85 30 85 80s-42 95-92 95-80-38-80-88 37-87 87-87z"/>
          <path d="M150 72c32 0 55 22 55 54s-28 62-60 62-52-25-52-57 25-59 57-59z"/>
          <path d="M150 104c16 0 28 11 28 26s-14 30-30 30-27-13-27-28 13-28 29-28z"/>

        <path class="route" d="M92 200 C120 170 140 190 160 150 S200 120 214 96" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

        <g class="pin pin2"><g transform="translate(214 84) scale(.8)"><path d="M0 18 C-14 2 -14 -16 0 -18 C14 -16 14 2 0 18Z" fill="#ff7a59" stroke="var(--outline)" stroke-width="3.5"/><circle cy="-6" r="4.5" fill="#fff" stroke="var(--outline)" stroke-width="3"/></g></g>
      </svg>
      <div class="top">
        <span class="num">01</span>
        <h2>搶修案件地圖</h2>
      </div>
      <div class="bottom"><span class="go" aria-hidden="true">→</span></div>
    </a>

    <a class="tile lake" href="https://aggieyang1118.github.io/case-pm/" target="_blank" rel="noopener">
      <svg class="scene" viewBox="0 0 240 250" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
        <g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2.5" stroke-linecap="round">
          <path class="waves" d="M0 200 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0"/>
          <path class="waves w2" d="M-120 226 q15 -10 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0"/>
        </g>
        <!-- 進度條板 -->
        <g transform="translate(118 112) scale(.85)">
          <rect width="124" height="96" rx="10" fill="#fff" stroke="var(--outline)" stroke-width="3"/>
          <rect class="bar" x="14" y="18" width="92" height="12" rx="6" fill="#25945a" stroke="var(--outline)" stroke-width="2"/>
          <rect class="bar b2" x="14" y="42" width="80" height="12" rx="6" fill="var(--sun)" stroke="var(--outline)" stroke-width="2"/>
          <rect class="bar b3" x="14" y="66" width="62" height="12" rx="6" fill="#ff7a59" stroke="var(--outline)" stroke-width="2"/>
        </g>
        <path class="spark" d="M96 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="var(--sun)" stroke="var(--outline)" stroke-width="2"/>
        <path class="spark s2" d="M226 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff" stroke="var(--outline)" stroke-width="2"/>
        <path class="spark s3" d="M200 186 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="var(--sun)" stroke="var(--outline)" stroke-width="2"/>
      </svg>
      <div class="top">
        <span class="num">02</span>
        <h2>標案進度管理系統</h2>
      </div>
      <div class="bottom"><span class="go" aria-hidden="true">→</span></div>
    </a>
    <a class="tile sunset" href="https://aggieyang1118.github.io/student/" target="_blank" rel="noopener">
      <svg class="scene" viewBox="0 0 240 250" preserveAspectRatio="xMaxYMax meet" aria-hidden="true">
        <g transform="translate(96 70) rotate(-6)">
          <rect width="118" height="148" rx="8" fill="#fff" stroke="var(--outline)" stroke-width="3"/>
          <g stroke="#cfd8d2" stroke-width="5" stroke-linecap="round">
            <path d="M40 34 H96"/><path d="M40 70 H90"/><path d="M40 106 H96"/>
          </g>
          <g fill="none" stroke="#25945a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path class="tick" d="M14 32 l7 7 13 -14"/>
            <path class="tick t2" d="M14 68 l7 7 13 -14"/>
            <path class="tick t3" d="M14 104 l7 7 13 -14"/>
          </g>
        </g>
        <g class="stamp"><g transform="translate(176 196)">
          <circle r="27" fill="none" stroke="#e5383b" stroke-width="4"/>
          <text y="8" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" font-weight="700" fill="#e5383b">100</text>
        </g></g>
        <path class="star" d="M66 120 l9 18 20 3 -14 14 3 20 -18 -9 -18 9 3 -20 -14 -14 20 -3z" fill="var(--sun)" stroke="var(--outline)" stroke-width="3" stroke-linejoin="round"/>
        <path class="spark s2" d="M224 56 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff" stroke="var(--outline)" stroke-width="2"/>
      </svg>
      <div class="top">
        <span class="num">03</span>
        <h2>小三生大挑戰</h2>
      </div>
      <div class="bottom"><span class="go" aria-hidden="true">→</span></div>
    </a>
  </main>

  <footer><span>Aggie Yang</span></footer>
</div>
</body>
</html>
